name: Build and publish Ant Media Community image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Ant Media Server Community version (for example 3.1.0)"
        required: true
        default: "3.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Community version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Ant Media Community version $VERSION"

      - name: Download official Community release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="ant-media-server-community-${VERSION}.zip"
          URL="https://github.com/ant-media/Ant-Media-Server/releases/download/ams-v${VERSION}/${ZIP}"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" --output "$ZIP"
          echo "Downloaded $ZIP"
          sha256sum "$ZIP"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            AntMediaServer=ant-media-server-community-${{ steps.version.outputs.version }}.zip
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:community
          labels: |
            org.opencontainers.image.title=Sancode Ant Media Community
            org.opencontainers.image.description=Container image built from the official Ant Media Server Community release
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Print image reference
        run: |
          echo "Published ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          echo "After the first publish, set the GHCR package visibility to Public if you want passwordless pulls from your VPS."
